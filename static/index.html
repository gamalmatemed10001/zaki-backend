<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>Zaki — Test Console</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; height: 80px; font-size: 16px; padding: 8px; box-sizing: border-box; }
  input[type=text] { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 8px; }
  button { padding: 8px 20px; font-size: 16px; cursor: pointer; }
  #reply { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; min-height: 40px; margin-top: 12px; }
  #meta { color: #666; font-size: 12px; margin-top: 6px; }
  label { font-size: 12px; color: #555; }
  #googleStatus { font-size: 13px; margin-bottom: 16px; }
  #googleStatus a { margin-inline-start: 8px; }
</style>
</head>
<body>
  <h2>زكي — Test Console</h2>
  <div id="googleStatus">Google: checking… <a href="/auth/google/login">Connect Google</a></div>
  <label>X-API-Key</label>
  <input type="text" id="apiKey" placeholder="paste ZAKI_API_KEY" />
  <label>Message</label>
  <textarea id="text" placeholder="اكتب رسالتك هنا..."></textarea>
  <br /><br />
  <button onclick="send()">Send</button>
  <div id="reply"></div>
  <div id="meta"></div>

<script>
async function checkGoogleStatus() {
  const el = document.getElementById('googleStatus');
  try {
    const res = await fetch('/auth/google/status');
    const data = await res.json();
    el.innerHTML = data.connected
      ? '✅ Google connected'
      : '⚠️ Google not connected <a href="/auth/google/login">Connect Google</a>';
  } catch {
    el.textContent = 'Google: status check failed';
  }
}
checkGoogleStatus();

async function send() {
  const text = document.getElementById('text').value;
  const apiKey = document.getElementById('apiKey').value;
  const replyEl = document.getElementById('reply');
  const metaEl = document.getElementById('meta');
  replyEl.textContent = '...';
  metaEl.textContent = '';
  try {
    const res = await fetch('/api/assistant', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-API-Key': apiKey,
      },
      body: JSON.stringify({ text, session_id: 'test-console' }),
    });
    const data = await res.json();
    if (!res.ok) {
      replyEl.textContent = 'Error: ' + (data.detail || res.status);
      return;
    }
    replyEl.textContent = data.reply;
    metaEl.textContent = `route: ${data.route} · model: ${data.model}`;
  } catch (err) {
    replyEl.textContent = 'Request failed: ' + err;
  }
}
</script>
</body>
</html>
