[project]
name = "zaki-assistant-os"
version = "0.1.0"
description = "Zaki (زكي) — a personal AI assistant that speaks native Egyptian Arabic"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.117.1",
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "pydantic-settings>=2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "asyncpg>=0.29.0",
    "ddgs>=8.1.0",
    "openai>=1.50.0",
    "python-multipart>=0.0.9",
    "edge-tts>=7.2.0",
    # WhatsApp (Evolution API) — plain REST client, no vendor SDK exists
    # for a self-hosted gateway.
    "httpx>=0.27.0",
    # Phone calls (Twilio). Verify this floor against PyPI at install
    # time — not independently confirmed current, same discipline as
    # every other vendor dependency in this file.
    "twilio>=9.0.0",
    # Reminders / daily briefing scheduling. Pinned below 4.x deliberately —
    # APScheduler 4 was still pre-release/API-unstable as of this writing;
    # verify before ever bumping past 3.x.
    "apscheduler>=3.10.0,<4",
    # Backs APScheduler's persistent job store (SQLite by default, or
    # Postgres via ZAKI_REMINDERS_DB_URL — see scheduler.py). No separate
    # DB driver needed for SQLite (stdlib sqlite3 covers it); psycopg2
    # below is only exercised when a postgresql:// URL is configured.
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zaki"]

# Vercel loads `app` from src/zaki/main.py. Filename auto-detection does not
# reach this deep, so the entrypoint is declared explicitly.
[tool.vercel]
entrypoint = "zaki.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
